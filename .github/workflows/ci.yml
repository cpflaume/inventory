name: CI

# Qualitäts-Gate auf jedem PR / Push: Backend, Frontend, E2E getrennt.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-latest
    # Echte Postgres als Service-Container (robuster als Testcontainers auf dem Runner).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jurtenburg
          POSTGRES_USER: jurtenburg
          POSTGRES_PASSWORD: jurtenburg
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Gesetzt → die Integrationstests verbinden gegen diesen Service, statt
      # Testcontainers zu starten (siehe AbstractIntegrationTest).
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/jurtenburg
      SPRING_DATASOURCE_USERNAME: jurtenburg
      SPRING_DATASOURCE_PASSWORD: jurtenburg
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: backend/*.gradle

      - name: Test
        run: ./gradlew --no-daemon test

      - name: Build bootJar
        run: ./gradlew --no-daemon bootJar

  frontend:
    name: Frontend (Vite/React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright, echtes Backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jurtenburg
          POSTGRES_USER: jurtenburg
          POSTGRES_PASSWORD: jurtenburg
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: backend/*.gradle

      - name: Build backend jar
        working-directory: backend
        run: ./gradlew --no-daemon bootJar

      - name: Start seeded backend
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/jurtenburg
          SPRING_DATASOURCE_USERNAME: jurtenburg
          SPRING_DATASOURCE_PASSWORD: jurtenburg
          APP_SEED_DEMO: "true"
          SERVER_PORT: "8080"
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-plain' | head -1)
          nohup java -jar "$JAR" > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 2
          done
          curl -sf http://localhost:8080/actuator/health || (echo "Backend nicht gestartet:"; cat /tmp/backend.log; exit 1)

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
