name: CI

# Qualitäts-Gate auf jedem PR / Push: Backend + Frontend getrennt.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (Gradle + Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: backend/*.gradle

      - name: Test (JUnit + Testcontainers Postgres)
        run: ./gradlew --no-daemon test

      - name: Build bootJar
        run: ./gradlew --no-daemon bootJar

  frontend:
    name: Frontend (Vite/React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
