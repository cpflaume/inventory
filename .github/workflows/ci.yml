name: CI

# Qualitäts-Gate auf jedem PR / Push: Backend, Frontend, E2E getrennt.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      record_all_videos:
        description: "E2E: Videos ALLER Tests aufzeichnen (Default: nur fehlgeschlagene)"
        type: boolean
        default: false

jobs:
  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-latest
    # Echte Postgres als Service-Container (robuster als Testcontainers auf dem Runner).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: jurtenburg
          POSTGRES_USER: jurtenburg
          POSTGRES_PASSWORD: jurtenburg
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Gesetzt → die Integrationstests verbinden gegen diesen Service, statt
      # Testcontainers zu starten (siehe AbstractIntegrationTest).
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/jurtenburg
      SPRING_DATASOURCE_USERNAME: jurtenburg
      SPRING_DATASOURCE_PASSWORD: jurtenburg
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: backend/*.gradle

      - name: Test
        run: ./gradlew --no-daemon test

      - name: Build bootJar
        run: ./gradlew --no-daemon bootJar

  frontend:
    name: Frontend (Vite/React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright, echtes Backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: jurtenburg
          POSTGRES_USER: jurtenburg
          POSTGRES_PASSWORD: jurtenburg
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: backend/*.gradle

      - name: Build backend jar
        working-directory: backend
        run: ./gradlew --no-daemon bootJar

      - name: Start seeded backend
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/jurtenburg
          SPRING_DATASOURCE_USERNAME: jurtenburg
          SPRING_DATASOURCE_PASSWORD: jurtenburg
          APP_SEED_DEMO: "true"
          SERVER_PORT: "8080"
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-plain' | head -1)
          nohup java -jar "$JAR" > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 2
          done
          curl -sf http://localhost:8080/actuator/health || (echo "Backend nicht gestartet:"; cat /tmp/backend.log; exit 1)

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: frontend
        env:
          # Standard: nur Videos fehlgeschlagener Tests behalten. Per manuellem
          # workflow_dispatch mit record_all_videos=true → alle Videos aufzeichnen.
          E2E_VIDEO: ${{ (github.event_name == 'workflow_dispatch' && inputs.record_all_videos) && 'all' || '' }}
        run: npm run e2e

      - name: Upload E2E videos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-videos
          # Playwright legt Videos/Traces unter test-results/ ab. Bei Default-Läufen
          # liegen dort nur die Videos fehlgeschlagener Tests; grüner Lauf → leer.
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
