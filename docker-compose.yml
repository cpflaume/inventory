# Lokale Entwicklungsumgebung: Postgres + Backend (Docker) + Frontend (Vite-Dev).
# Start: docker compose up --build
# Danach: Frontend http://localhost:5173 , API/Swagger http://localhost:8080/swagger-ui/index.html
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jurtenburg
      POSTGRES_USER: jurtenburg
      POSTGRES_PASSWORD: jurtenburg
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jurtenburg"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/jurtenburg
      SPRING_DATASOURCE_USERNAME: jurtenburg
      SPRING_DATASOURCE_PASSWORD: jurtenburg
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      APP_SEED_DEMO: "true"
    ports:
      - "8080:8080"

  # Frontend als Vite-Dev-Server (Hot Reload + /api-Proxy an das Backend).
  # Das Produktions-Frontend läuft dagegen als eigenes nginx-Image (frontend/Dockerfile).
  frontend:
    image: node:24-alpine
    working_dir: /app
    depends_on: [backend]
    environment:
      VITE_API_TARGET: http://backend:8080
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
