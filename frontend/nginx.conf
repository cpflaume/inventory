# SPA-Auslieferung. Listen auf 8080 (non-root, passt zur nginx-unprivileged Image).
# Der try_files-Fallback macht das Deep-Link-/Reload-Verhalten der SPA — genau
# die Aufgabe, die bei runtime: static sonst Caddy übernommen hätte.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Statische Assets aggressiv cachen (Vite hasht die Dateinamen).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA-Fallback: unbekannte Pfade liefern index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
