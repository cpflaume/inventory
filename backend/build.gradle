plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'de.grauerreiter'
// Version = Release-Tag, zur Build-Zeit über APP_VERSION hereingereicht
// (backend/Dockerfile-ARG, gefüttert aus release.yml). Lokal/ohne Release: „dev".
version = System.getenv('APP_VERSION') ?: 'dev'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Erzeugt META-INF/build-info.properties → /actuator/info liefert die Version
// (build.version), sodass die laufende API ihren Release-Tag ausweist.
springBoot {
    buildInfo()
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Spring Security OAuth2 Client: die Standard-Bibliothek für den OIDC-Login (Authorization
    // Code + PKCE, Discovery, JWKS-Verifikation des ID-Tokens, Nonce/State, UserInfo-Merge).
    // Ersetzt die früher händisch gebaute Naht; bringt oauth2-jose (Nimbus) transitiv mit.
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
}
