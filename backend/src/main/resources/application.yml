spring:
  application:
    name: jurtenburg-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jurtenburg}
    username: ${SPRING_DATASOURCE_USERNAME:jurtenburg}
    password: ${SPRING_DATASOURCE_PASSWORD:jurtenburg}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html

app:
  cors:
    # Dev-Default erlaubt den Vite-Dev-Server (5173) und den E2E-Port (5174).
    # In Produktion via CORS_ALLOWED_ORIGINS überschrieben.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  seed-demo: ${APP_SEED_DEMO:true}
  jwt:
    # Dev-Default (nur lokal!). In Produktion via JWT_SECRET (>= 32 Bytes) setzen.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-32bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    issuer: jurtenburg
  admin:
    # Bootstrap-Admin: wird beim Start angelegt, falls noch kein Admin existiert.
    # Der Benutzername ist zugleich die Login-E-Mail.
    username: ${APP_ADMIN_USERNAME:admin@jurtenburg.local}
    password: ${APP_ADMIN_PASSWORD:admin12345}
  oidc:
    # Single-Sign-On (z.B. Nextcloud). Standard: AUS — die App läuft dann rein lokal.
    # Zum Aktivieren OIDC_ENABLED=true und die vier Pflichtwerte unten setzen.
    enabled: ${OIDC_ENABLED:false}
    # Basis-URL des IdP (ohne /.well-known/...); zugleich erwarteter iss-Claim.
    issuer-uri: ${OIDC_ISSUER_URI:}
    # Optional: explizite Discovery-URL, falls der IdP das Dokument nicht unter
    # ${issuer}/.well-known/openid-configuration ausliefert (Nextcloud oft
    # /index.php/apps/oidc/openid-configuration). Leer = aus issuer-uri abgeleitet.
    configuration-uri: ${OIDC_CONFIGURATION_URI:}
    client-id: ${OIDC_CLIENT_ID:}
    # Vom IdP vergeben; in Produktion als Secret injizieren (nie ins Repo).
    client-secret: ${OIDC_CLIENT_SECRET:}
    # Muss beim IdP als Redirect-URI hinterlegt sein (öffentliche Callback-URL dieser App).
    redirect-uri: ${OIDC_REDIRECT_URI:}
    scopes: ${OIDC_SCOPES:openid profile email groups}
    groups-claim: ${OIDC_GROUPS_CLAIM:groups}
    auto-create-groups: ${OIDC_AUTO_CREATE_GROUPS:true}
    # Ziel im Frontend nach Login (Token/Fehler im URL-Fragment). Leer = aus redirect-uri abgeleitet.
    post-login-redirect-uri: ${OIDC_POST_LOGIN_REDIRECT_URI:}
